name: Publish to PyPI

# Publish tabicl with PyPI Trusted Publishing. GitHub Actions mints a
# short-lived OpenID Connect token for this workflow, and PyPI exchanges it
# for upload credentials. No API token is stored in the repository.
#
# Before the first release, register this workflow as a trusted publisher:
# https://pypi.org/manage/project/tabicl/settings/publishing/
#   Owner: soda-inria
#   Repository: tabicl
#   Workflow name: publish.yml
#   Environment name: pypi
# Then create a GitHub Environment named "pypi" and require approval from a
# maintainer. The environment name must match the publisher above.
# https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Check that the tag matches the package version
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          text = pathlib.Path("src/tabicl/__about__.py").read_text()
          match = re.search(r"""__version__\s*=\s*['"]([^'"]+)['"]""", text)
          if match is None:
              raise SystemExit(
                  "Could not read __version__ from src/tabicl/__about__.py"
              )
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          print(f"package version: {version}")
          print(f"git tag: {tag}")
          if tag != f"v{version}":
              raise SystemExit(
                  f"Package version {version} does not match tag {tag} "
                  f"(expected v{version})."
              )
          PY
      - name: Build sdist and wheel
        run: |
          python3 -m pip install build
          python3 -m build
      - name: Check distribution metadata
        run: |
          python3 -m pip install twine
          python3 -m twine check --strict dist/*
      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tabicl
    # Job permissions replace the workflow permissions. This job only needs
    # to mint an OIDC token; it does not check out the repository.
    permissions:
      id-token: write
    steps:
      - name: Download the distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        # release/v1 is the stable tag maintained by PyPA.
        uses: pypa/gh-action-pypi-publish@release/v1
